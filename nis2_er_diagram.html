
<style>
#erd { width:100%; overflow-x:auto; }
#erd svg { max-width:100%; display:block; }
</style>
<div id="erd" style="min-height:320px"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#eeedf5',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    attributeBackgroundColorEven: dark ? '#1e1e1c' : '#f8f7fe',
    attributeBackgroundColorOdd: dark ? '#262624' : '#f1f0fb',
  },
});

const src = `erDiagram
  ORGANIZZAZIONE {
    int id PK
    varchar nome
    varchar settore_nis2
    varchar categoria_nis2
    varchar pec
    bool attiva
  }
  SEDE {
    int id PK
    int organizzazione_id FK
    varchar nome
    varchar citta
    varchar paese
  }
  TIPO_ASSET {
    varchar codice PK
    varchar descrizione
    varchar categoria
  }
  ASSET {
    int id PK
    int organizzazione_id FK
    int sede_id FK
    varchar tipo_asset_cod FK
    varchar codice_inventario
    varchar nome
    varchar categoria
    varchar stato
  }
  ASSET_STORICO {
    int id PK
    int asset_id FK
    varchar campo
    text val_prec
    text val_nuovo
    timestamp ts
  }
  SERVIZIO {
    int id PK
    int organizzazione_id FK
    varchar nome
    varchar criticita
    int rto_ore
    int rpo_ore
    varchar stato
  }
  ASSET_SERVIZIO {
    int asset_id FK
    int servizio_id FK
    varchar ruolo
    date data_inizio
  }
  FORNITORE {
    int id PK
    varchar nome
    varchar tipo
    varchar paese
    bool is_critico
  }
  CONTRATTO {
    int id PK
    int organizzazione_id FK
    int fornitore_id FK
    varchar numero_contratto
    date data_scadenza
    numeric sla_disponibilita
    bool clausole_sicurezza
  }
  DIPENDENZA {
    int id PK
    int organizzazione_id FK
    int asset_id FK
    int servizio_id FK
    int fornitore_id FK
    int contratto_id FK
    varchar tipo
    varchar criticita
  }
  PERSONA {
    int id PK
    int organizzazione_id FK
    varchar nome
    varchar cognome
    varchar email
    varchar ruolo
    bool is_referente_acn
  }
  RESPONSABILITA {
    int id PK
    int persona_id FK
    int asset_id FK
    int servizio_id FK
    varchar tipo
    date data_inizio
    date data_fine
  }
  MISURA_SICUREZZA {
    int id PK
    int organizzazione_id FK
    int asset_id FK
    int servizio_id FK
    varchar articolo_nis2
    varchar categoria
    varchar nome
    varchar stato_impl
  }
  PROFILO_ACN {
    int id PK
    int organizzazione_id FK
    int compilato_da FK
    int versione
    varchar stato
    timestamp data_compilazione
  }

  ORGANIZZAZIONE ||--o{ ASSET : "ha"
  ORGANIZZAZIONE ||--o{ SERVIZIO : "eroga"
  ORGANIZZAZIONE ||--o{ PERSONA : "impiega"
  ORGANIZZAZIONE ||--o{ SEDE : "ha"
  ORGANIZZAZIONE ||--o{ CONTRATTO : "stipula"
  ORGANIZZAZIONE ||--o{ DIPENDENZA : "owner"
  ORGANIZZAZIONE ||--o{ MISURA_SICUREZZA : "adotta"
  ORGANIZZAZIONE ||--o{ PROFILO_ACN : "genera"
  SEDE ||--o{ ASSET : "ospita"
  TIPO_ASSET ||--o{ ASSET : "classifica"
  ASSET ||--o{ ASSET_STORICO : "audit"
  ASSET ||--o{ ASSET_SERVIZIO : "supporta"
  ASSET ||--o{ DIPENDENZA : "ha"
  ASSET ||--o{ RESPONSABILITA : "ha"
  ASSET ||--o{ MISURA_SICUREZZA : "coperta_da"
  SERVIZIO ||--o{ ASSET_SERVIZIO : "usa"
  SERVIZIO ||--o{ DIPENDENZA : "ha"
  SERVIZIO ||--o{ RESPONSABILITA : "ha"
  SERVIZIO ||--o{ MISURA_SICUREZZA : "coperta_da"
  FORNITORE ||--o{ CONTRATTO : "ha"
  FORNITORE ||--o{ DIPENDENZA : "soddisfa"
  CONTRATTO ||--o{ DIPENDENZA : "regola"
  PERSONA ||--o{ RESPONSABILITA : "ha"
  PERSONA ||--o{ PROFILO_ACN : "compila"
`;

try {
  const { svg } = await mermaid.render('erd-svg', src);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
    const fp = node.querySelector('path[d]');
    if (!fp) return;
    const nums = fp.getAttribute('d').match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill','stroke','stroke-width','class','style'])
      if (fp.hasAttribute(a)) rect.setAttribute(a, fp.getAttribute(a));
    fp.replaceWith(rect);
  });

  document.querySelectorAll(
    '#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path'
  ).forEach(p => p.setAttribute('stroke','none'));

} catch(e) {
  document.getElementById('erd').innerHTML =
    `<p style="color:var(--color-text-danger);padding:1rem">Errore nel rendering: ${e.message}</p>`;
}
</script>
